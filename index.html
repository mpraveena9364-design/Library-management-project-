<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>📚 Library Hub</h2>
    <button class="secondary" type="button" onclick="resetBooks()">Reset Books</button>
  </header>

  <main class="container">
    <h1>Library Management Interface</h1>
    <p>Add, search, edit, issue and return books.</p>

    <section class="stats" aria-label="Book statistics">
      <div class="stat"><h3>Total Books</h3><h2 id="totalBooks">0</h2></div>
      <div class="stat"><h3>Available Books</h3><h2 id="availableBooks">0</h2></div>
      <div class="stat"><h3>Issued Books</h3><h2 id="issuedBooks">0</h2></div>
    </section>

    <div class="layout">
      <section class="panel">
        <h2 id="formTitle">Add a Book</h2>
        <form id="bookForm">
          <input type="hidden" id="bookId">
          <label for="title">Book Title</label>
          <input id="title" required placeholder="Enter book title">
          <label for="author">Author</label>
          <input id="author" required placeholder="Enter author name">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Choose category</option>
            <option>Fiction</option><option>Science</option>
            <option>Technology</option><option>History</option>
            <option>Education</option><option>Biography</option><option>Other</option>
          </select>
          <label for="year">Published Year</label>
          <input id="year" type="number" min="1000" max="2100" placeholder="e.g. 2024">
          <button class="primary" type="submit" id="submitBtn">Add Book</button>
          <button class="secondary" type="button" onclick="cancelEdit()">Cancel</button>
        </form>
      </section>

      <section class="panel">
        <h2>Book Collection</h2>
        <label class="visually-hidden" for="search">Search books</label>
        <input id="search" placeholder="Search books..." oninput="renderBooks()">
        <label class="visually-hidden" for="statusFilter">Filter by status</label>
        <select id="statusFilter" onchange="renderBooks()">
          <option value="">All Statuses</option>
          <option value="Available">Available</option>
          <option value="Issued">Issued</option>
        </select>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Book Details</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="bookTable"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
